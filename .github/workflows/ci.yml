name: 🧪 CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 🧪 Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v7

      - name: 🧰 Setup
        uses: ./.github/actions/setup

      - name: 🎨 Check formatting
        run: npm run format:check

      - name: 🧹 Lint
        run: npm run lint

      - name: 🔎 Typecheck
        run: npm run typecheck

      - name: 🧪 Tests
        run: npm test

      - name: 🩺 Expo doctor
        run: npx expo-doctor

  security:
    name: 🔐 Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v7

      - name: 🔐 Audit dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: 🔍 Review new dependencies
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  bundle:
    name: 📦 JS bundle size
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v7

      - name: 🧰 Setup
        uses: ./.github/actions/setup

      - name: 🏗️ Export bundles
        run: npx expo export --platform ios --platform android --output-dir dist

      - name: 📏 Report sizes
        run: |
          {
            echo "### 📦 JS bundle size"
            echo "| Platform | Size |"
            echo "|---|---|"
            for platform in ios android; do
              echo "| $platform | $(du -ch dist/_expo/static/js/$platform/* | tail -1 | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
