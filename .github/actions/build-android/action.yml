name: 🤖 Build Android APK
description: Generates the native Android project and builds a release APK.

outputs:
  apk-path:
    description: Path to the built APK
    value: ${{ steps.apk.outputs.path }}

runs:
  using: composite
  steps:
    - name: 🧰 Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: lts/*
        cache: npm

    - name: ☕ Setup Java
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: 17

    - name: 🐘 Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: 📦 Install dependencies
      shell: bash
      run: npm ci

    - name: 🗣️ Download the Vosk model
      shell: bash
      run: npm run setup:model

    - name: 🏗️ Generate the Android project
      shell: bash
      run: npx expo prebuild --platform android --clean --no-install

    # Signed with the debug key of the Expo template: installable on any phone, not publishable on a store.
    - name: 🏗️ Build release APK
      shell: bash
      working-directory: android
      run: ./gradlew assembleRelease --no-daemon

    - name: 📏 Report APK size
      id: apk
      shell: bash
      run: |
        path=android/app/build/outputs/apk/release/app-release.apk
        echo "path=$path" >> "$GITHUB_OUTPUT"
        echo "### 📏 APK size: $(du -h "$path" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
